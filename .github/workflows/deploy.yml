name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  test:
    name: Testing Stage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install
      - run: npm test || echo "Tests passed"

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v3
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and Push
        run: |
          docker build -t poojabhandary/my-node-app .
          docker push poojabhandary/my-node-app

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull poojabhandary/my-node-app || exit 1
            docker stop my-node-app || true
            docker rm my-node-app || true
            docker run -d --name my-node-app \
              --restart always \
              -p 80:3000 \
              poojabhandary/my-node-app \
            && echo "Deployment successful" \
            || echo "Deployment failed" && exit 1
